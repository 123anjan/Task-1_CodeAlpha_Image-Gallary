<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Interactive Gallary</title>

    <!-- CSS Files link -->
    <link rel="stylesheet" href="assets/CSS files/style.css">
    <link rel="stylesheet" href="assets/CSS files/responsive.css">
    <link rel="stylesheet" href="assets/CSS files/Animations.css">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="header">
        <h1 class="header-title">Visual showcase</h1>
        <p class="header-subtitle">Explore handpicked collection across categories</p>
    </header>

    <main class="gallery-container">
    <!-- Category Filter Controls -->
    <nav class="filter-wrapper">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="nature">Nature</button>
      <button class="filter-btn" data-filter="birds">birds</button>
      <button class="filter-btn" data-filter="mountains"> Mountains</button>
      <button class="filter-btn" data-filter="starry-sky">Starry-sky</button>
    </nav>

  </main>
</body>
</html>
